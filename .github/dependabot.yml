# Weekly dependency updates: one grouped PR per ecosystem for minor/patch,
# majors as separate PRs (GitHub Actions: everything in one PR).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The build image follows the Java and Maven pinned in mise.toml (Java 25
      # LTS); Dependabot otherwise proposes non-LTS JDKs via the tag suffix.
      - dependency-name: library/maven
      # Runtime JRE: stay on the LTS major, take its patch updates.
      - dependency-name: library/eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
